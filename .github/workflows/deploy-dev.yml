name: Build and deploy (development)

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      # GHCR requires a lowercase image name
      - id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.vars.outputs.image }}:dev
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e

            # Runtime config (DATABASE_URL, AUTH0_*, REDIS_REST_*, API_JWT_SECRET, OTEL_*)
            # lives on the VPS, never in the image or the repo. Create it once by hand.
            ENV_FILE="$HOME/gin-product-service/.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE on the VPS (see .env.example)" >&2
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT

            docker pull "$IMAGE"

            PREVIOUS=$(docker inspect --format '{{.Config.Image}}' gin-product-service 2>/dev/null || true)

            docker rm -f gin-product-service 2>/dev/null || true
            docker run -d --name gin-product-service --restart unless-stopped \
              --env-file "$ENV_FILE" -e APP_ENV=production \
              -p 5000:5000 "$IMAGE"

            # Wait for the Dockerfile HEALTHCHECK (/healthz) to report healthy
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' gin-product-service)
              [ "$status" = "healthy" ] && break
              if [ "$status" = "unhealthy" ] || [ "$(docker inspect --format '{{.State.Running}}' gin-product-service)" != "true" ]; then
                break
              fi
              sleep 3
            done

            if [ "$status" != "healthy" ]; then
              echo "Deploy failed (status: $status). Container logs:" >&2
              docker logs --tail 50 gin-product-service >&2 || true
              if [ -n "$PREVIOUS" ]; then
                echo "Rolling back to $PREVIOUS" >&2
                docker rm -f gin-product-service || true
                docker run -d --name gin-product-service --restart unless-stopped \
                  --env-file "$ENV_FILE" -e APP_ENV=production \
                  -p 5000:5000 "$PREVIOUS" || true
              fi
              exit 1
            fi

            docker image prune -f
