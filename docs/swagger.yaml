basePath: /api/v1
definitions:
  domain.Category:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      thumbnail:
        type: string
      updated_at:
        type: string
    type: object
  domain.CategoryOption:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.CreateCategoryInput:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      thumbnail:
        type: string
    required:
    - name
    type: object
  domain.PaginatedCategories:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Category'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.PaginatedProducts:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.ProductListItem'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.ProductCategory:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  domain.ProductListItem:
    properties:
      category:
        $ref: '#/definitions/domain.ProductCategory'
      created_at:
        type: string
      description:
        type: string
      handle:
        type: string
      id:
        type: string
      media:
        items:
          $ref: '#/definitions/domain.ProductMedia'
        type: array
      options:
        items:
          $ref: '#/definitions/domain.ProductOption'
        type: array
      prices:
        $ref: '#/definitions/domain.ProductPrices'
      status:
        $ref: '#/definitions/domain.ProductStatus'
      thumbnail:
        $ref: '#/definitions/domain.ProductThumbnail'
      title:
        type: string
      updated_at:
        type: string
      variants:
        items:
          $ref: '#/definitions/domain.Variant'
        type: array
      vendor:
        type: string
    type: object
  domain.ProductMedia:
    properties:
      alt_text:
        type: string
      created_at:
        type: string
      id:
        type: string
      position:
        type: integer
      product_id:
        type: string
      type:
        description: '"image", "video"'
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  domain.ProductOption:
    properties:
      id:
        type: string
      name:
        type: string
      position:
        type: integer
      product_id:
        type: string
      values:
        items:
          $ref: '#/definitions/domain.ProductOptionValue'
        type: array
    type: object
  domain.ProductOptionValue:
    properties:
      id:
        type: string
      option_id:
        type: string
      position:
        type: integer
      value:
        type: string
    type: object
  domain.ProductPrices:
    properties:
      maxPrice:
        type: number
      startPrice:
        type: number
    type: object
  domain.ProductStatus:
    enum:
    - draft
    - active
    - archived
    type: string
    x-enum-varnames:
    - ProductStatusDraft
    - ProductStatusActive
    - ProductStatusArchived
  domain.ProductThumbnail:
    properties:
      altText:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  domain.UpdateCategoryInput:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      thumbnail:
        type: string
    required:
    - name
    type: object
  domain.Variant:
    properties:
      barcode:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      media:
        items:
          $ref: '#/definitions/domain.VariantMedia'
        type: array
      position:
        description: Position is the display order of this variant within its product.
        type: integer
      price:
        type: number
      product_id:
        type: string
      sku:
        type: string
      stock:
        description: |-
          Stock is the total available quantity across all inventory levels for
          this variant. It is computed (not stored) and only populated on the
          single-product detail path.
        type: integer
      title:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  domain.VariantMedia:
    properties:
      id:
        type: string
      position:
        type: integer
    type: object
  dto.AttachVariantMediaInput:
    properties:
      media_id:
        type: string
    required:
    - media_id
    type: object
  dto.BulkCreateMediaInput:
    properties:
      media:
        items:
          $ref: '#/definitions/dto.CreateMediaInput'
        minItems: 1
        type: array
    required:
    - media
    type: object
  dto.BulkCreateVariantsInput:
    properties:
      variants:
        items:
          $ref: '#/definitions/dto.CreateVariantInput'
        minItems: 1
        type: array
    required:
    - variants
    type: object
  dto.BulkDeleteVariantsInput:
    properties:
      ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - ids
    type: object
  dto.BulkUpdateVariantsInput:
    properties:
      updates:
        items:
          $ref: '#/definitions/dto.VariantUpdateItem'
        minItems: 1
        type: array
    required:
    - updates
    type: object
  dto.CreateMediaInput:
    properties:
      altText:
        type: string
      position:
        minimum: 0
        type: integer
      type:
        enum:
        - image
        - video
        type: string
      url:
        type: string
    required:
    - type
    - url
    type: object
  dto.CreateOptionInput:
    properties:
      name:
        type: string
      values:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - values
    type: object
  dto.CreateOptionValueInput:
    properties:
      position:
        minimum: 0
        type: integer
      value:
        type: string
    required:
    - value
    type: object
  dto.CreateProductInput:
    properties:
      categoryId:
        type: integer
      description:
        type: string
      gallery:
        items:
          $ref: '#/definitions/dto.GalleryMediaInput'
        type: array
      handle:
        type: string
      options:
        items:
          $ref: '#/definitions/dto.ProductOptionInput'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/domain.ProductStatus'
        enum:
        - draft
        - active
        - archived
      title:
        type: string
      variants:
        items:
          $ref: '#/definitions/dto.VariantInput'
        minItems: 1
        type: array
      vendor:
        type: string
    required:
    - categoryId
    - handle
    - title
    - variants
    type: object
  dto.CreateVariantInput:
    properties:
      barcode:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.VariantMediaItemInput'
        type: array
      options:
        additionalProperties:
          type: string
        type: object
      price:
        type: number
      sku:
        type: string
      stock:
        minimum: 0
        type: integer
      title:
        type: string
      track_inventory:
        type: boolean
      weight:
        type: number
    required:
    - price
    - weight
    type: object
  dto.GalleryMediaInput:
    properties:
      altText:
        type: string
      id:
        type: string
      position:
        type: integer
      type:
        type: string
      url:
        type: string
    required:
    - id
    - url
    type: object
  dto.PositionUpdate:
    properties:
      id:
        type: string
      position:
        minimum: 0
        type: integer
    required:
    - id
    type: object
  dto.ProductOptionInput:
    properties:
      name:
        type: string
      values:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - values
    type: object
  dto.ReorderMediaInput:
    properties:
      positions:
        items:
          $ref: '#/definitions/dto.PositionUpdate'
        minItems: 1
        type: array
    required:
    - positions
    type: object
  dto.ReorderOptionsInput:
    properties:
      positions:
        items:
          $ref: '#/definitions/dto.PositionUpdate'
        minItems: 1
        type: array
    required:
    - positions
    type: object
  dto.ReorderVariantsInput:
    properties:
      positions:
        items:
          $ref: '#/definitions/dto.PositionUpdate'
        minItems: 1
        type: array
    required:
    - positions
    type: object
  dto.UpdateMediaInput:
    properties:
      altText:
        type: string
    type: object
  dto.UpdateOptionInput:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.UpdateOptionValueInput:
    properties:
      position:
        minimum: 0
        type: integer
      value:
        type: string
    type: object
  dto.UpdateProductInput:
    properties:
      categoryId:
        type: integer
      description:
        type: string
      handle:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ProductStatus'
        enum:
        - draft
        - active
        - archived
      title:
        type: string
      vendor:
        type: string
    type: object
  dto.UpdateVariantInput:
    properties:
      barcode:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.VariantMediaItemInput'
        type: array
      price:
        type: number
      sku:
        type: string
      stock:
        minimum: 0
        type: integer
      title:
        type: string
      weight:
        type: number
    type: object
  dto.VariantInput:
    properties:
      barcode:
        type: string
      media:
        items:
          $ref: '#/definitions/dto.VariantMediaInput'
        type: array
      options:
        additionalProperties:
          type: string
        type: object
      price:
        type: number
      sku:
        type: string
      stock:
        minimum: 0
        type: integer
      title:
        type: string
      track_inventory:
        type: boolean
      weight:
        type: number
    required:
    - price
    - weight
    type: object
  dto.VariantMediaInput:
    properties:
      id:
        type: string
      position:
        type: integer
    required:
    - id
    type: object
  dto.VariantMediaItemInput:
    properties:
      altText:
        type: string
      id:
        type: string
      position:
        type: integer
      type:
        type: string
      url:
        type: string
    type: object
  dto.VariantUpdateItem:
    properties:
      fields:
        $ref: '#/definitions/dto.UpdateVariantInput'
      id:
        type: string
    required:
    - fields
    - id
    type: object
host: localhost:5000
info:
  contact: {}
  description: REST API for Product & Category Service
  title: Gin Product Service API
  version: "1.0"
paths:
  /categories:
    get:
      description: Get a paginated, filterable list of all existing categories
      parameters:
      - description: Filter by partial (case-insensitive) name match
        in: query
        name: name
        type: string
      - description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: 'Sort column. One of: name, created_at'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction. One of: asc, desc'
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedCategories'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new product category
      parameters:
      - description: Category to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateCategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Soft-delete an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category (soft delete)
      tags:
      - categories
    get:
      description: Get a single category by its numeric ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a category
      tags:
      - categories
  /categories/dropdown:
    get:
      description: Get a lightweight list (id + name) of categories for dropdown UI
      parameters:
      - description: Filter by partial (case-insensitive) name match
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CategoryOption'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List categories for dropdown
      tags:
      - categories
  /products:
    get:
      description: Get a paginated, filterable list of products
      parameters:
      - description: Filter by partial (case-insensitive) title, handle or category
          name match
        in: query
        name: search
        type: string
      - description: Filter by category ID (0 means no filter)
        in: query
        name: category_id
        type: integer
      - description: 'Filter by status. One of: draft, active, archived'
        in: query
        name: status
        type: string
      - description: Minimum variant price (inclusive). Products must have a variant
          priced >= minPrice
        in: query
        name: minPrice
        type: number
      - description: Maximum variant price (inclusive). Products must have a variant
          priced <= maxPrice
        in: query
        name: maxPrice
        type: number
      - description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: 'Sort column. One of: title, created_at, category_name'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction. One of: asc, desc'
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedProducts'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a product with options, variants, gallery and initial stock
        in one transaction
      parameters:
      - description: Product to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      description: Soft-delete a product by setting its status to archived
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Archive a product (soft delete)
      tags:
      - products
    get:
      description: Get a single product (with options, variants and media) by UUID
        or handle
      parameters:
      - description: Product UUID or handle
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a product by ID or handle
      tags:
      - products
    patch:
      consumes:
      - application/json
      description: Update product header fields only (title, description, vendor,
        handle, categoryId, status). Omitted fields are left unchanged.
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProductInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a product
      tags:
      - products
  /products/{id}/media:
    post:
      consumes:
      - application/json
      description: Upload/attach new media to a product's gallery (accepts an array)
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Media to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.BulkCreateMediaInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Attach media to a product gallery
      tags:
      - products
  /products/{id}/media/{media_id}:
    delete:
      description: Remove media from a product entirely (cascades variant media links)
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Media UUID
        in: path
        name: media_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete product media
      tags:
      - products
    patch:
      consumes:
      - application/json
      description: Update a media item's metadata (alt_text)
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Media UUID
        in: path
        name: media_id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMediaInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update media metadata
      tags:
      - products
  /products/{id}/media/reorder:
    patch:
      consumes:
      - application/json
      description: Bulk-update the positions of a product's gallery media
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: New positions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReorderMediaInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Reorder product media
      tags:
      - products
  /products/{id}/options:
    post:
      consumes:
      - application/json
