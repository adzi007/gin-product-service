basePath: /api/v1
definitions:
  domain.Category:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      thumbnail:
        type: string
      updated_at:
        type: string
    type: object
  domain.CategoryOption:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.CreateCategoryInput:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      thumbnail:
        type: string
    required:
    - name
    type: object
  domain.CreateProductInput:
    properties:
      categoryId:
        type: integer
      description:
        type: string
      gallery:
        items:
          $ref: '#/definitions/domain.GalleryMediaInput'
        type: array
      handle:
        type: string
      options:
        items:
          $ref: '#/definitions/domain.ProductOptionInput'
        type: array
      title:
        type: string
      variants:
        items:
          $ref: '#/definitions/domain.VariantInput'
        minItems: 1
        type: array
      vendor:
        type: string
    required:
    - categoryId
    - handle
    - title
    - variants
    type: object
  domain.GalleryMediaInput:
    properties:
      altText:
        type: string
      id:
        type: string
      position:
        type: integer
      type:
        type: string
      url:
        type: string
    required:
    - id
    - url
    type: object
  domain.PaginatedCategories:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Category'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.ProductOptionInput:
    properties:
      name:
        type: string
      values:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - values
    type: object
  domain.UpdateCategoryInput:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      thumbnail:
        type: string
    required:
    - name
    type: object
  domain.VariantInput:
    properties:
      barcode:
        type: string
      media:
        items:
          $ref: '#/definitions/domain.VariantMediaInput'
        type: array
      options:
        additionalProperties:
          type: string
        type: object
      price:
        type: number
      sku:
        type: string
      stock:
        minimum: 0
        type: integer
      title:
        type: string
      track_inventory:
        type: boolean
      weight:
        type: number
    required:
    - price
    - weight
    type: object
  domain.VariantMediaInput:
    properties:
      id:
        type: string
      position:
        type: integer
    required:
    - id
    type: object
host: localhost:5000
info:
  contact: {}
  description: REST API for Product & Category Service
  title: Gin Product Service API
  version: "1.0"
paths:
  /categories:
    get:
      description: Get a paginated, filterable list of all existing categories
      parameters:
      - description: Filter by partial (case-insensitive) name match
        in: query
        name: name
        type: string
      - description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: 'Sort column. One of: name, created_at'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction. One of: asc, desc'
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedCategories'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new product category
      parameters:
      - description: Category to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateCategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Soft-delete an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category (soft delete)
      tags:
      - categories
    get:
      description: Get a single category by its numeric ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a category
      tags:
      - categories
  /categories/dropdown:
    get:
      description: Get a lightweight list (id + name) of categories for dropdown UI
      parameters:
      - description: Filter by partial (case-insensitive) name match
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CategoryOption'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List categories for dropdown
      tags:
      - categories
  /products:
    post:
      consumes:
      - application/json
      description: Create a product with options, variants, gallery and initial stock
        in one transaction
      parameters:
      - description: Product to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a product
      tags:
      - products
swagger: "2.0"
