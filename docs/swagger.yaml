basePath: /api/v1
definitions:
  domain.Category:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      thumbnail:
        type: string
      updated_at:
        type: string
    type: object
  domain.CategoryOption:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.CreateCategoryInput:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      thumbnail:
        type: string
    required:
    - name
    type: object
  domain.CreateOptionInput:
    properties:
      name:
        type: string
      values:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - values
    type: object
  domain.CreateOptionValueInput:
    properties:
      position:
        minimum: 0
        type: integer
      value:
        type: string
    required:
    - value
    type: object
  domain.CreateProductInput:
    properties:
      categoryId:
        type: integer
      description:
        type: string
      gallery:
        items:
          $ref: '#/definitions/domain.GalleryMediaInput'
        type: array
      handle:
        type: string
      options:
        items:
          $ref: '#/definitions/domain.ProductOptionInput'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/domain.ProductStatus'
        enum:
        - draft
        - active
        - archived
      title:
        type: string
      variants:
        items:
          $ref: '#/definitions/domain.VariantInput'
        minItems: 1
        type: array
      vendor:
        type: string
    required:
    - categoryId
    - handle
    - title
    - variants
    type: object
  domain.GalleryMediaInput:
    properties:
      altText:
        type: string
      id:
        type: string
      position:
        type: integer
      type:
        type: string
      url:
        type: string
    required:
    - id
    - url
    type: object
  domain.PaginatedCategories:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Category'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.PaginatedProducts:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Product'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  domain.PositionUpdate:
    properties:
      id:
        type: string
      position:
        minimum: 0
        type: integer
    required:
    - id
    type: object
  domain.Product:
    properties:
      category:
        $ref: '#/definitions/domain.ProductCategory'
      created_at:
        type: string
      description:
        type: string
      handle:
        type: string
      id:
        type: string
      media:
        items:
          $ref: '#/definitions/domain.ProductMedia'
        type: array
      options:
        items:
          $ref: '#/definitions/domain.ProductOption'
        type: array
      prices:
        $ref: '#/definitions/domain.ProductPrices'
      status:
        $ref: '#/definitions/domain.ProductStatus'
      thumbnail:
        $ref: '#/definitions/domain.ProductThumbnail'
      title:
        type: string
      updated_at:
        type: string
      variants:
        items:
          $ref: '#/definitions/domain.Variant'
        type: array
      vendor:
        type: string
    type: object
  domain.ProductCategory:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  domain.ProductMedia:
    properties:
      alt_text:
        type: string
      created_at:
        type: string
      id:
        type: string
      position:
        type: integer
      product_id:
        type: string
      type:
        description: '"image", "video"'
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  domain.ProductOption:
    properties:
      id:
        type: string
      name:
        type: string
      position:
        type: integer
      product_id:
        type: string
      values:
        items:
          $ref: '#/definitions/domain.ProductOptionValue'
        type: array
    type: object
  domain.ProductOptionInput:
    properties:
      name:
        type: string
      values:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - values
    type: object
  domain.ProductOptionValue:
    properties:
      id:
        type: string
      option_id:
        type: string
      position:
        type: integer
      value:
        type: string
    type: object
  domain.ProductPrices:
    properties:
      maxPrice:
        type: number
      startPrice:
        type: number
    type: object
  domain.ProductStatus:
    enum:
    - draft
    - active
    - archived
    type: string
    x-enum-varnames:
    - ProductStatusDraft
    - ProductStatusActive
    - ProductStatusArchived
  domain.ProductThumbnail:
    properties:
      altText:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  domain.ReorderOptionsInput:
    properties:
      positions:
        items:
          $ref: '#/definitions/domain.PositionUpdate'
        minItems: 1
        type: array
    required:
    - positions
    type: object
  domain.UpdateCategoryInput:
    properties:
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      thumbnail:
        type: string
    required:
    - name
    type: object
  domain.UpdateOptionInput:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  domain.UpdateOptionValueInput:
    properties:
      position:
        minimum: 0
        type: integer
      value:
        type: string
    type: object
  domain.UpdateProductInput:
    properties:
      categoryId:
        type: integer
      description:
        type: string
      handle:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/domain.ProductStatus'
        enum:
        - draft
        - active
        - archived
      title:
        type: string
      vendor:
        type: string
    type: object
  domain.Variant:
    properties:
      barcode:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      media:
        items:
          $ref: '#/definitions/domain.VariantMedia'
        type: array
      price:
        type: number
      product_id:
        type: string
      sku:
        type: string
      stock:
        description: |-
          Stock is the total available quantity across all inventory levels for
          this variant. It is computed (not stored) and only populated on the
          single-product detail path.
          Stock decimal.Decimal `json:"stock" db:"stock"`
        type: integer
      title:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  domain.VariantInput:
    properties:
      barcode:
        type: string
      media:
        items:
          $ref: '#/definitions/domain.VariantMediaInput'
        type: array
      options:
        additionalProperties:
          type: string
        type: object
      price:
        type: number
      sku:
        type: string
      stock:
        minimum: 0
        type: integer
      title:
        type: string
      track_inventory:
        type: boolean
      weight:
        type: number
    required:
    - price
    - weight
    type: object
  domain.VariantMedia:
    properties:
      id:
        type: string
      position:
        type: integer
    type: object
  domain.VariantMediaInput:
    properties:
      id:
        type: string
      position:
        type: integer
    required:
    - id
    type: object
host: localhost:5000
info:
  contact: {}
  description: REST API for Product & Category Service
  title: Gin Product Service API
  version: "1.0"
paths:
  /categories:
    get:
      description: Get a paginated, filterable list of all existing categories
      parameters:
      - description: Filter by partial (case-insensitive) name match
        in: query
        name: name
        type: string
      - description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: 'Sort column. One of: name, created_at'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction. One of: asc, desc'
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedCategories'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new product category
      parameters:
      - description: Category to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateCategoryInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a category
      tags:
      - categories
  /categories/{id}:
    delete:
      description: Soft-delete an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category (soft delete)
      tags:
      - categories
    get:
      description: Get a single category by its numeric ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update an existing product category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateCategoryInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a category
      tags:
      - categories
  /categories/dropdown:
    get:
      description: Get a lightweight list (id + name) of categories for dropdown UI
      parameters:
      - description: Filter by partial (case-insensitive) name match
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CategoryOption'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List categories for dropdown
      tags:
      - categories
  /products:
    get:
      description: Get a paginated, filterable list of products
      parameters:
      - description: Filter by partial (case-insensitive) title, handle or category
          name match
        in: query
        name: search
        type: string
      - description: Filter by category ID (0 means no filter)
        in: query
        name: category_id
        type: integer
      - description: 'Filter by status. One of: draft, active, archived'
        in: query
        name: status
        type: string
      - description: Page number (1-indexed)
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: 'Sort column. One of: title, created_at, category_name'
        in: query
        name: sort_by
        type: string
      - description: 'Sort direction. One of: asc, desc'
        in: query
        name: sort_dir
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PaginatedProducts'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a product with options, variants, gallery and initial stock
        in one transaction
      parameters:
      - description: Product to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a product
      tags:
      - products
  /products/{id}:
    delete:
      description: Soft-delete a product by setting its status to archived
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Archive a product (soft delete)
      tags:
      - products
    get:
      description: Get a single product (with options, variants and media) by UUID
        or handle
      parameters:
      - description: Product UUID or handle
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a product by ID or handle
      tags:
      - products
    patch:
      consumes:
      - application/json
      description: Update product header fields only (title, description, vendor,
        handle, categoryId, status). Omitted fields are left unchanged.
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateProductInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a product
      tags:
      - products
  /products/{id}/options:
    post:
      consumes:
      - application/json
      description: Create a new option with its initial values for a product
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Option to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateOptionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a product option
      tags:
      - products
  /products/{id}/options/{option_id}:
    delete:
      description: Remove an option and all of its values from a product
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Option UUID
        in: path
        name: option_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a product option
      tags:
      - products
    patch:
      consumes:
      - application/json
      description: Rename an existing option on a product
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Option UUID
        in: path
        name: option_id
        required: true
        type: string
      - description: New option name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateOptionInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Rename a product option
      tags:
      - products
  /products/{id}/options/{option_id}/values:
    post:
      consumes:
      - application/json
      description: Add a new value to an existing option
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Option UUID
        in: path
        name: option_id
        required: true
        type: string
      - description: Value to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateOptionValueInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Add an option value
      tags:
      - products
  /products/{id}/options/{option_id}/values/{value_id}:
    delete:
      description: Remove a single value from an option
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Option UUID
        in: path
        name: option_id
        required: true
        type: string
      - description: Option value UUID
        in: path
        name: value_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete an option value
      tags:
      - products
    patch:
      consumes:
      - application/json
      description: Rename or reorder a single option value
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: Option UUID
        in: path
        name: option_id
        required: true
        type: string
      - description: Option value UUID
        in: path
        name: value_id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateOptionValueInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update an option value
      tags:
      - products
  /products/{id}/options/reorder:
    patch:
      consumes:
      - application/json
      description: Bulk-update the positions of a product's options
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      - description: New positions
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.ReorderOptionsInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Reorder product options
      tags:
      - products
  /products/{id}/purge:
    delete:
      description: Hard-delete a product and its related rows. Blocked (409) when
        the product has stock movement history.
      parameters:
      - description: Product UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
